apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-info-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-info-app
  template:
    metadata:
      labels:
        app: student-info-app
    spec:
      containers:
        - name: student-info-container
          image: student-info-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000